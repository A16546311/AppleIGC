name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: xcodebuild -project AppleIGC.xcodeproj -scheme AppleIGC -configuration Release -derivedDataPath build ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=-
      - name: Ad-hoc sign
        run: codesign --force --sign - build/Build/Products/Release/AppleIGC.kext
      - uses: actions/upload-artifact@v4
        with:
          name: AppleIGC-kext
          path: build/Build/Products/Release/AppleIGC.kext
